services:
  - type: web
    name: ordering-system-backend
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python -m pip install --upgrade setuptools && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
